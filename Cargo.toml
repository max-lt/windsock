[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }

hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
strip = true
opt-level = 3
codegen-units = 1
lto = true
