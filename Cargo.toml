[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
chunking = { path = "crates/chunking" }
pack = { path = "crates/pack" }
remote = { path = "crates/remote" }
journal = { path = "crates/journal" }
index = { path = "crates/index" }
engine = { path = "crates/engine" }
cache = { path = "crates/cache" }
s3api = { path = "crates/s3api" }
s3proto = { path = "crates/s3proto" }
s3remote = { path = "crates/s3remote" }
windsockd = { path = "crates/windsockd" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
form_urlencoded = "1"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
quick-xml = { version = "0.37", features = ["serialize"] }
sha2 = "0.10"
subtle = "2"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
blake3 = { version = "1", features = ["pure"] }
bytes = "1"
ed25519-dalek = "2"
fastcdc = "5"
fjall = "3"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
stateright = "0.31"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
opt-level = 3
codegen-units = 1
lto = true
