[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
model = { path = "crates/model" }
chunking = { path = "crates/chunking" }
pack = { path = "crates/pack" }
remote = { path = "crates/remote" }

async-trait = "0.1"
blake3 = { version = "1", features = ["pure"] }
bytes = "1"
fastcdc = "5"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tokio = "1"

[profile.release]
strip = true
opt-level = 3
codegen-units = 1
lto = true
